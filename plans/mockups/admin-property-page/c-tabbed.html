<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · Tabbed workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="common.js"></script>
<link rel="stylesheet" href="common.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head><body>
<div id="page" class="mx-auto max-w-[1600px]">
<a href="#" class="mb-2 inline-flex items-center gap-1.5 text-[13px] font-semibold text-muted hover:text-ink"><svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>Back</a><div class="mb-3 flex flex-wrap items-center gap-x-2.5 gap-y-1"><h1 class="text-[20px] font-semibold leading-7 tracking-tight">Two-Bedroom House near SRP Talisay</h1><span class="inline-flex h-[22px] items-center rounded-md bg-[#FBBF24]/[0.16] px-1.5 text-[12px] font-semibold text-[#B45309]">Pending</span></div><p class="-mt-2.5 mb-3 text-[13px] text-muted">Bulacao, Talisay City, Cebu</p>
  <div class="grid items-start gap-3 lg:grid-cols-[minmax(0,1fr)_300px]">
    <div class="min-w-0">
      <nav class="mb-3 flex gap-0.5 overflow-x-auto border-b border-line"><button data-tab="overview" class="-mb-px inline-flex h-10 items-center gap-1.5 whitespace-nowrap border-b-2 px-3 text-[13px] border-coral font-semibold text-ink">Overview</button><button data-tab="units" class="-mb-px inline-flex h-10 items-center gap-1.5 whitespace-nowrap border-b-2 px-3 text-[13px] border-transparent font-medium text-muted hover:text-ink">Units<span class="text-[12px] tabular-nums text-muted">1</span></button><button data-tab="documents" class="-mb-px inline-flex h-10 items-center gap-1.5 whitespace-nowrap border-b-2 px-3 text-[13px] border-transparent font-medium text-muted hover:text-ink">Documents<span class="text-[12px] tabular-nums text-muted">0/0</span></button><button data-tab="activity" class="-mb-px inline-flex h-10 items-center gap-1.5 whitespace-nowrap border-b-2 px-3 text-[13px] border-transparent font-medium text-muted hover:text-ink">Activity<span class="text-[12px] tabular-nums text-muted">5</span></button><button data-tab="reservations" class="-mb-px inline-flex h-10 items-center gap-1.5 whitespace-nowrap border-b-2 px-3 text-[13px] border-transparent font-medium text-muted hover:text-ink">Reservations<span class="text-[12px] tabular-nums text-muted">0</span></button></nav>
      <section data-pane="overview" class="space-y-3">
        <div class="grid gap-3 xl:grid-cols-2">
          <div class="grid h-[20rem] grid-cols-2 grid-rows-2 gap-1.5"><button data-photo="https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=1200&q=80" class="group relative block overflow-hidden bg-tint col-span-2 rounded-xl" aria-label="Open photo 1 full size"><img src="https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=1200&q=80" alt="" class="h-full w-full object-cover transition duration-500 group-hover:scale-[1.03]"></button><button data-photo="https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=1200&q=80" class="group relative block overflow-hidden bg-tint rounded-xl" aria-label="Open photo 2 full size"><img src="https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=1200&q=80" alt="" class="h-full w-full object-cover transition duration-500 group-hover:scale-[1.03]"></button><button data-photo="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=1200&q=80" class="group relative block overflow-hidden bg-tint rounded-xl" aria-label="Open photo 3 full size"><img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=1200&q=80" alt="" class="h-full w-full object-cover transition duration-500 group-hover:scale-[1.03]"></button></div>
          <div class="relative h-[20rem] overflow-hidden rounded-xl border border-line"><div id="mapC" class="js-map h-full w-full" data-zoom="16"></div><div class="absolute left-2.5 top-2.5 z-[500] flex gap-1.5"><button data-sat-toggle="mapC" class="inline-flex h-8 items-center gap-1.5 rounded-lg border border-line bg-white px-2.5 text-[12.5px] font-semibold shadow-sm hover:bg-canvas"><span>Satellite</span></button><a href="https://www.google.com/maps?q=10.2571,123.8479" target="_blank" rel="noopener" class="inline-flex h-8 items-center gap-1.5 rounded-lg border border-line bg-white px-2.5 text-[12.5px] font-semibold shadow-sm hover:bg-canvas">Open in Google Maps <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-4.5-7.5H21m0 0v7.5M21 3l-9 9"/></svg></a></div></div>
        </div>
        <div class="rounded-xl border border-line bg-white p-4 shadow-[0_1px_3px_rgba(6,13,38,0.06)]"><div data-slot="facts"></div>
          <p class="mt-2.5 max-w-[75ch] text-[13px] leading-5 text-muted">Two-bedroom house with parking and a washing machine, twenty minutes from the SRP. Quiet street, pets welcome.</p></div>
      </section>
      <section data-pane="units" class="hidden"><div data-slot="units"></div></section>
      <section data-pane="documents" class="hidden"><div data-slot="documents"></div></section>
      <section data-pane="activity" class="hidden"><div data-slot="activity"></div></section>
      <section data-pane="reservations" class="hidden"><div data-slot="reservations"></div></section>
    </div>
    <div class="space-y-3 lg:sticky lg:top-4"><div data-slot="decision"></div><div data-slot="landlord"></div></div>
  </div>
  <script>
  window.addEventListener('mock-ready',function(){var tabs=[].slice.call(document.querySelectorAll('[data-tab]'));tabs.forEach(function(t){t.addEventListener('click',function(){tabs.forEach(function(o){var on=o===t;o.classList.toggle('border-coral',on);o.classList.toggle('font-semibold',on);o.classList.toggle('text-ink',on);o.classList.toggle('border-transparent',!on);o.classList.toggle('text-muted',!on);o.classList.toggle('font-medium',!on);});document.querySelectorAll('[data-pane]').forEach(function(p){p.classList.toggle('hidden',p.dataset.pane!==t.dataset.tab);});document.querySelectorAll('.js-map').forEach(function(m){m._map.invalidateSize();});});});});
  </script>
</div></body></html>
